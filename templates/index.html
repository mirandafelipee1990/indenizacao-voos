<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indenização por Voo Atrasado ou Cancelado</title>
    <!-- Carrega o design system moderno (Tailwind CSS) automaticamente -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 font-sans">

    <!-- Seção Principal (Hero Section) -->
    <section class="relative bg-gradient-to-br from-slate-900 via-blue-900 to-indigo-900 text-white min-h-[85vh] flex items-center py-12 px-4 sm:px-6 lg:px-8 overflow-hidden">
      <div class="max-w-7xl mx-auto w-full grid grid-cols-1 lg:grid-cols-12 gap-12 items-center">
        
        <!-- Coluna Esquerda: Texto e Formulário de Captura -->
        <div class="lg:col-span-7 space-y-6">
          <div class="space-y-3">
            <span class="inline-block bg-blue-500/20 text-blue-300 border border-blue-400/30 text-xs font-semibold px-3 py-1 rounded-full uppercase tracking-wider">
              Verificação Rápida e Sem Riscos
            </span>
            <h1 class="text-4xl sm:text-5xl font-extrabold tracking-tight leading-tight">
              Voo atrasado ou cancelado? <br/>
              <span class="text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-cyan-300">
                Receba até R$ 10.000!
              </span>
            </h1>
            <p class="text-slate-300 text-lg max-w-xl">
              Você tem direitos garantidos por lei. Nós cuidamos de toda a burocracia para você ser compensado de forma rápida.
            </p>
          </div>

          <!-- Formulário com os cartões interativos -->
          <form action="/verificar" method="POST" class="bg-white text-slate-900 p-6 rounded-2xl shadow-2xl space-y-4 max-w-xl border border-slate-100">
            <h3 class="text-lg font-bold text-slate-800">O que deu errado com o seu voo?</h3>
            
            <div class="space-y-3">
              <!-- Opção 1 -->
              <label class="incidente-card flex items-center justify-between p-4 border-2 border-blue-600 bg-blue-50/50 rounded-xl cursor-pointer transition-all">
                <div class="flex items-center space-x-3">
                  <span class="text-blue-600 font-bold">✈️</span>
                  <span class="font-medium text-slate-900">Voo atrasado (mais de 3h)</span>
                </div>
                <input type="radio" name="incidente" value="atrasado" checked class="w-4 h-4 text-blue-600 focus:ring-blue-500">
              </label>

              <!-- Opção 2 -->
              <label class="incidente-card flex items-center justify-between p-4 border-2 border-slate-200 hover:border-slate-300 rounded-xl cursor-pointer transition-all">
                <div class="flex items-center space-x-3">
                  <span class="text-slate-500 font-bold">❌</span>
                  <span class="font-medium text-slate-700">Voo cancelado</span>
                </div>
                <input type="radio" name="incidente" value="cancelado" class="w-4 h-4 text-blue-600 focus:ring-blue-500">
              </label>

              <!-- Opção 3 -->
              <label class="incidente-card flex items-center justify-between p-4 border-2 border-slate-200 hover:border-slate-300 rounded-xl cursor-pointer transition-all">
                <div class="flex items-center space-x-3">
                  <span class="text-slate-500 font-bold">⚠️</span>
                  <span class="font-medium text-slate-700">Perda de conexão / Outros</span>
                </div>
                <input type="radio" name="incidente" value="outro" class="w-4 h-4 text-blue-600 focus:ring-blue-500">
              </label>
            </div>

            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl shadow-lg shadow-blue-600/30 transition-all text-center text-base">
              Descubra o quanto pode ganhar
            </button>
          </form>
        </div>

        <!-- Coluna Direita: Imagem Profissional de Fundo -->
        <div class="lg:col-span-5 hidden lg:block">
          <div class="relative mx-auto max-w-md">
            <div class="absolute -inset-1 bg-gradient-to-r from-blue-600 to-cyan-400 rounded-3xl blur-xl opacity-30"></div>
            <div class="relative bg-slate-800 border border-slate-700 p-3 rounded-3xl shadow-2xl overflow-hidden">
              <img src="https://images.unsplash.com/photo-1436491865332-7a61a109cc05?auto=format&fit=crop&w=800&q=80" alt="Passageiros no aeroporto" class="rounded-2xl object-cover h-[420px] w-full">
            </div>
          </div>
        </div>

      </div>
    </section>

    <!-- Script leve para alternar a seleção visual dos cartões ao clicar -->
    <script>
      document.querySelectorAll('input[name="incidente"]').forEach((radio) => {
        radio.addEventListener('change', (e) => {
          document.querySelectorAll('.incidente-card').forEach(card => {
            card.classList.remove('border-blue-600', 'bg-blue-50/50');
            card.classList.add('border-slate-200');
          });
          const parentLabel = e.target.closest('label');
          parentLabel.classList.remove('border-slate-200');
          parentLabel.classList.add('border-blue-600', 'bg-blue-50/50');
        });
      });
    </script>
</body>
</html>
